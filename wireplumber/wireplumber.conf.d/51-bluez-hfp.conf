## Enable HFP/HSP roles so the Bluetooth card exposes a headset-head-unit
## profile with a microphone source, not only A2DP sinks.
##
## Requires CONFIG_BT_RFCOMM=m (or =y, but =y is silently dropped when BT=m)
## in the kernel; without RFCOMM bluetoothd cannot start the HFP/HSP RFCOMM
## server and the head-unit profile never appears.

monitor.bluez.properties = {
  bluez5.enable-sbc-xq    = true
  bluez5.enable-msbc      = true
  bluez5.enable-hw-volume = true
  bluez5.roles  = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag hsp_hs hsp_ag ]
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd cvsd msbc lc3_swb lc3 opus_g ]
  bluez5.hfphsp-backend = "native"
}

## Auto-switch the BT card to headset-head-unit (HFP) the moment a
## capture stream wants the BT mic, then revert to A2DP when the mic
## stream goes away. Without this the user has to flip profiles by hand
## every time a call starts/ends.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
