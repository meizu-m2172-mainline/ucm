LibraryConfig.pcm.SubstiConfig.pcm."m2172_stereo" {
	@args [ CARD DEV ]
	@args {
		CARD.type string
		DEV.type integer
	}
	type route
	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		channels 2
		format S16_LE
	}
	ttable.0.0 1
	ttable.1.1 1
}

SectionVerb {
	EnableSequence [
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='aw882xx_mode_switch_l' 0"
		cset "name='aw882xx_mode_switch_r' 0"
		cset "name='aw882xx_pa_switch_l' 0"
		cset "name='aw882xx_pa_switch_r' 0"
	]

	DisableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='aw882xx_pa_switch_l' 1"
		cset "name='aw882xx_pa_switch_r' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."StereoSpeaker" {
	Comment "Stereo Speakers"

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "m2172_stereo:${CardId},0"
		PlaybackChannel0 0
		PlaybackChannelPos0 FL
		PlaybackChannel1 1
		PlaybackChannelPos1 FR
	}
}
